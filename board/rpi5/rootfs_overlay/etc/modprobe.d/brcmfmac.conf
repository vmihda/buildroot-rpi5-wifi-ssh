# Disable firmware handshake offload in brcmfmac: FWSUP (bit 13, 0x2000)
# and SAE (bit 19, 0x80000).
# wpa_supplicant 2.12 waits for a PORT_AUTHORIZED event after an offloaded
# handshake, which this driver does not send, so auth times out after 10 s
# and the link reconnects in a loop. Mask recommended by Buildroot commit
# e7b3286c79 ("package/wpa_supplicant: revert upstream commit to fix brcmfmac").
options brcmfmac feature_disable=0x82000
